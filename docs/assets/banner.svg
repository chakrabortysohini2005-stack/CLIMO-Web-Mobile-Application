<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">CLIMO — Know the sky, Own the day</title>
  <desc id="d">All-India weather and flood-risk GIS for web and Android.</desc>
  <defs>
    <radialGradient id="bg" cx="70%" cy="40%" r="85%">
      <stop offset="0" stop-color="#0d2346"/>
      <stop offset=".55" stop-color="#06122b"/>
      <stop offset="1" stop-color="#020817"/>
    </radialGradient>
    <linearGradient id="word" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#2fe3c4"/>
      <stop offset="1" stop-color="#2fa8ff"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" x2="1">
      <stop offset="0" stop-color="#2fe3c4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2fe3c4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2fe3c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamB" x1="0" x2="1">
      <stop offset="0" stop-color="#2fa8ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2fa8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2fa8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".5" stop-color="#ffcf5a"/>
      <stop offset="1" stop-color="#ff9a2e"/>
    </radialGradient>
    <radialGradient id="halo" r=".5">
      <stop offset="0" stop-color="#2fa8ff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#2fe3c4" stop-opacity=".08"/>
      <stop offset="1" stop-color="#2fe3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="riskbar" x1="0" x2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset=".34" stop-color="#4ADE80"/>
      <stop offset=".34" stop-color="#F2A65A"/>
      <stop offset=".66" stop-color="#F2A65A"/>
      <stop offset=".66" stop-color="#E4573D"/>
      <stop offset="1" stop-color="#E4573D"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2fa8ff" stroke-opacity=".06"/>
    </pattern>
    <style>
      .tw{animation:tw 3.2s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
      .flow{animation:flow 6s linear infinite}
      @keyframes flow{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
      .ping{transform-origin:1010px 215px;animation:ping 3s ease-out infinite}
      @keyframes ping{from{transform:scale(.2);opacity:.9}to{transform:scale(1.6);opacity:0}}
      .spin{transform-origin:1010px 215px;animation:spin 9s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .bob{animation:bob 4s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .rays{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
      .blink{animation:tw 1.6s ease-in-out infinite}
      text{font-family:'Space Grotesk','Segoe UI',Inter,system-ui,-apple-system,sans-serif}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>

  <rect width="1280" height="440" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="22" fill="url(#grid)"/>

  <!-- stars -->
  <g fill="#9cc8ff">
    <circle class="tw" cx="80" cy="40" r="1.3"/><circle class="tw" style="animation-delay:.4s" cx="300" cy="380" r="1.1"/>
    <circle class="tw" style="animation-delay:1.1s" cx="520" cy="60" r="1.4"/><circle class="tw" style="animation-delay:2s" cx="690" cy="400" r="1"/>
    <circle class="tw" style="animation-delay:.8s" cx="840" cy="40" r="1.2"/><circle class="tw" style="animation-delay:1.6s" cx="1220" cy="90" r="1.4"/>
    <circle class="tw" style="animation-delay:2.4s" cx="1180" cy="390" r="1.1"/><circle class="tw" style="animation-delay:.2s" cx="610" cy="250" r="1"/>
    <circle class="tw" style="animation-delay:1.3s" cx="40" cy="300" r="1.2"/><circle class="tw" style="animation-delay:2.7s" cx="760" cy="150" r="1"/>
  </g>

  <!-- wind streams -->
  <g>
    <rect class="flow" x="0" y="70" width="220" height="2" rx="1" fill="url(#stream)"/>
    <rect class="flow" style="animation-duration:8s;animation-delay:-3s" x="0" y="150" width="160" height="2" rx="1" fill="url(#streamB)"/>
    <rect class="flow" style="animation-duration:7s;animation-delay:-5s" x="0" y="330" width="260" height="2" rx="1" fill="url(#stream)"/>
    <rect class="flow" style="animation-duration:9s;animation-delay:-1s" x="0" y="395" width="180" height="2" rx="1" fill="url(#streamB)"/>
    <rect class="flow" style="animation-duration:6.5s;animation-delay:-2s" x="0" y="250" width="120" height="2" rx="1" fill="url(#streamB)"/>
  </g>

  <!-- logo badge (from the app's brand mark) -->
  <g class="bob">
    <circle cx="150" cy="140" r="78" fill="#2fa8ff" fill-opacity=".05" stroke="#2fe3c4" stroke-opacity=".35"/>
    <circle cx="150" cy="140" r="96" fill="url(#halo)"/>
    <g transform="translate(90 80) scale(3)">
      <g class="rays">
        <circle cx="20" cy="12" r="5.5" fill="#FFD54F"/>
        <path d="M13 5.5 L25 17 M27 5.5 L15 17" stroke="#FFD54F" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
      </g>
      <ellipse cx="17" cy="15" rx="3.5" ry="2.5" fill="#E3F2FD"/>
      <ellipse cx="22" cy="14" rx="3.8" ry="2.8" fill="#E3F2FD"/>
      <ellipse cx="19.5" cy="16.5" rx="4.5" ry="2" fill="#E3F2FD"/>
      <path d="M8 24 Q12 18 16 22 Q20 17 24 21 Q28 19 32 24 L32 26 Q28 28 24 26 Q20 28 16 26 Q12 28 8 26 Z" fill="#66BB6A"/>
      <path d="M8 26 Q12 24 16 26 Q20 24 24 26 Q28 24 32 26 L32 34 Q20 40 8 34 Z" fill="#2196F3"/>
      <path d="M8 28 Q12 26.5 16 28 Q20 26.5 24 28 Q28 26.5 32 28" stroke="#64B5F6" stroke-width=".8" fill="none" opacity=".7"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="270" y="150" font-size="104" font-weight="700" letter-spacing="14" fill="url(#word)">CLIMO</text>
  <text x="274" y="196" font-size="30" font-weight="600" fill="#eaf6ff">Know the sky, <tspan fill="#2fe3c4">Own the day.</tspan></text>
  <text class="mono" x="274" y="236" font-size="14" letter-spacing="2.4" fill="#9fb8d6">ALL-INDIA WEATHER · FLOOD-RISK · GIS · WEB + ANDROID</text>

  <!-- stat chips -->
  <g class="mono" font-size="15">
    <g transform="translate(274 272)">
      <rect width="168" height="40" rx="20" fill="#2fe3c4" fill-opacity=".08" stroke="#2fe3c4" stroke-opacity=".45"/>
      <circle class="blink" cx="22" cy="20" r="5" fill="#2fe3c4"/>
      <text x="38" y="25" fill="#cff8ef">90 stations</text>
    </g>
    <g transform="translate(456 272)">
      <rect width="190" height="40" rx="20" fill="#2fa8ff" fill-opacity=".08" stroke="#2fa8ff" stroke-opacity=".45"/>
      <text x="20" y="25" fill="#cfe6ff">2000 → 2030 LSTM</text>
    </g>
    <g transform="translate(660 272)">
      <rect width="160" height="40" rx="20" fill="#FFB648" fill-opacity=".08" stroke="#FFB648" stroke-opacity=".45"/>
      <text x="20" y="25" fill="#ffe6c2">16 languages</text>
    </g>
  </g>

  <!-- risk scale -->
  <g transform="translate(274 342)">
    <text class="mono" x="0" y="0" font-size="12" letter-spacing="2.5" fill="#7f98b8">FLOOD-RISK INDEX</text>
    <rect x="0" y="12" width="546" height="8" rx="4" fill="url(#riskbar)"/>
    <g class="mono" font-size="12" fill="#9fb8d6">
      <text x="0" y="42">0 · LOW</text>
      <text x="186" y="42">34 · MODERATE</text>
      <text x="360" y="42">66 · HIGH</text>
      <text x="522" y="42">100</text>
    </g>
  </g>

  <!-- radar -->
  <g>
    <circle cx="1010" cy="215" r="150" fill="none" stroke="#2fa8ff" stroke-opacity=".18"/>
    <circle cx="1010" cy="215" r="105" fill="none" stroke="#2fa8ff" stroke-opacity=".16"/>
    <circle cx="1010" cy="215" r="60" fill="none" stroke="#2fa8ff" stroke-opacity=".14"/>
    <path d="M860 215H1160M1010 65V365" stroke="#2fa8ff" stroke-opacity=".12"/>
    <circle class="ping" cx="1010" cy="215" r="100" fill="none" stroke="#2fe3c4" stroke-width="2"/>
    <g class="spin">
      <path d="M1010 215 L1010 65 A150 150 0 0 1 1116 109 Z" fill="#2fe3c4" fill-opacity=".14"/>
      <path d="M1010 215 L1010 65" stroke="#2fe3c4" stroke-opacity=".8" stroke-width="2"/>
    </g>
    <!-- risk blips -->
    <circle class="blink" cx="1062" cy="300" r="7" fill="#E4573D"/>
    <circle class="blink" style="animation-delay:.5s" cx="1040" cy="282" r="5" fill="#F2A65A"/>
    <circle class="blink" style="animation-delay:.9s" cx="955" cy="160" r="5" fill="#4ADE80"/>
    <circle class="blink" style="animation-delay:1.2s" cx="1098" cy="188" r="5" fill="#4ADE80"/>
    <circle class="blink" style="animation-delay:.3s" cx="930" cy="250" r="5" fill="#F2A65A"/>
    <!-- weather-safe route vs shortest -->
    <path d="M985 120 C 990 180, 1040 220, 1062 300" fill="none" stroke="#E4573D" stroke-width="3" stroke-dasharray="8 7" stroke-opacity=".9"/>
    <path d="M985 120 C 930 190, 960 300, 1062 330" fill="none" stroke="#2fe3c4" stroke-width="3.5"/>
    <circle cx="985" cy="120" r="7" fill="#4ADE80" stroke="#02142b" stroke-width="2"/>
    <text class="mono" x="1102" y="360" font-size="12" fill="#9fdccf">safe route ↺</text>
  </g>
  <!-- sun -->
  <g class="bob" style="animation-delay:-1.5s">
    <circle cx="1185" cy="78" r="30" fill="url(#sun)"/>
    <circle cx="1185" cy="78" r="44" fill="#ffb648" fill-opacity=".12"/>
  </g>
</svg>
